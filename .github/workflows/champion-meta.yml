name: Champion meta collection

# Keep the public champion sample current without putting Riot API calls on a
# visitor request. This runs halfway between the group-ingest windows so both
# jobs do not compete for the same Riot development-key rate limit.
on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: champion-meta
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh the EUW ranked sample
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$RIOT_API_KEY" ] || [ -z "$DATABASE_URL" ]; then
            echo "::error::RIOT_API_KEY and DATABASE_URL secrets are required."
            exit 1
          fi

          # 25 seeds × at most 10 recent ranked games. Ranked-ladder discovery
          # is idempotent, while last_collected_at rotates through the cohort.
          npm run meta:collect -- --platform=EUW --discover --seeds-per-tier=10 --limit=25 --matches=10
