name: Refresh avatars

# Discord avatar hashes change whenever somebody changes their picture. Keep
# the stored image used across boards, activity and friends fresh without
# requiring that person to sign in again.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: refresh-avatars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Discord names and avatars
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::DATABASE_URL and DISCORD_BOT_TOKEN secrets are required."
            exit 1
          fi
          npm run discord:refresh-avatars
