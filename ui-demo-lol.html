    ['adam', 'bilal', 5, 4], ['adam', 'omar', 3, 6]
  ];

  // ============================================================
  // Helpers
  // ============================================================

  function h(strings) {
    var out = strings[0];
    for (var i = 1; i < arguments.length; i++) out += arguments[i] + strings[i];
    return out;
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** Deterministic hue per champion/player so avatars stay stable between renders. */
  function hueOf(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
    return hash;
  }

  function initials(name) {
    var clean = name.replace(/[^A-Za-z0-9' ]/g, '');
    var parts = clean.split(/[\s']+/).filter(Boolean);
    if (parts.length > 1) return (parts[0][0] + parts[1][0]).toUpperCase();
    return clean.slice(0, 2).toUpperCase();
  }

  /**
   * Champion and profile art comes from Data Dragon in the real app. The demo
   * runs under a CSP that blocks external images, so avatars are generated.
   */
  function avatar(name, size) {
    var hue = hueOf(name);
    var cls = 'avatar' + (size ? ' ' + size : '');
    var bg = 'linear-gradient(145deg, hsl(' + hue + ' 62% 62%), hsl(' + ((hue + 38) % 360) + ' 58% 44%))';
    return h`<div class="${cls}" style="background:${bg}" title="${esc(name)}">${esc(initials(name))}</div>`;
  }

  function tierColor(tier) { return 'var(' + (TIER_VAR[tier] || '--faint') + ')'; }

  function tierLabel(p) {
    if (p.tier === 'UNRANKED') return 'Unranked';
    var pretty = p.tier.charAt(0) + p.tier.slice(1).toLowerCase();
    return pretty + ' ' + p.div + ' · ' + p.lp + ' LP';
  }

  function perfColor(score) {
    if (score >= 75) return 'var(--good)';
    if (score >= 55) return 'var(--amber)';
    if (score >= 45) return 'var(--muted)';
    return 'var(--bad)';
  }

  function perfBadge(score) {
    var color = perfColor(score);
    var bg = score >= 75 ? 'var(--good-soft)' : score < 45 ? 'var(--bad-soft)' : 'var(--surface-2)';
    return h`<div class="perf-badge" style="color:${color};background:${bg}">${score.toFixed(1)}</div>`;
  }

  function moveChip(move) {
    if (!move) return '<span class="chip">—</span>';
    var cls = move > 0 ? 'good' : 'bad';
    var arrow = move > 0 ? '▲' : '▼';
    return h`<span class="chip ${cls}">${arrow} ${Math.abs(move)}</span>`;
  }

  /** Sparkline of recent performance scores, most recent on the right. */
  function sparkline(values, width, height) {
    var series = values.slice().reverse();
    var min = Math.min.apply(null, series);
    var max = Math.max.apply(null, series);
    var span = Math.max(1, max - min);
    var stepX = width / Math.max(1, series.length - 1);
    var points = series.map(function (v, i) {
      var x = i * stepX;
      var y = height - ((v - min) / span) * (height - 4) - 2;
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var last = points[points.length - 1].split(',');
    var area = 'M0,' + height + ' L' + points.join(' L') + ' L' + width + ',' + height + ' Z';
    var id = 'sp' + Math.random().toString(36).slice(2, 8);

    return h`<svg class="spark" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--amber)" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      <polyline points="${points.join(' ')}" fill="none" stroke="var(--amber)" stroke-width="1.5"
        stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="var(--amber)"/>
    </svg>`;
  }

  /** Gold difference chart: filled above and below a zero line. */
  function goldChart(series, width, height) {
    var peak = Math.max.apply(null, series.map(Math.abs));
    var scale = Math.ceil(peak / 2500) * 2500;
    var stepX = width / (series.length - 1);
    var mid = height / 2;
    var toY = function (v) { return mid - (v / scale) * (mid - 8); };
    var points = series.map(function (v, i) { return (i * stepX).toFixed(1) + ',' + toY(v).toFixed(1); });
    var area = 'M0,' + mid + ' L' + points.join(' L') + ' L' + width + ',' + mid + ' Z';

    var ticks = '';
    for (var m = 0; m <= series.length - 1; m += 5) {
      var x = (m * stepX).toFixed(1);
      ticks += h`<line x1="${x}" y1="0" x2="${x}" y2="${height}" stroke="var(--line-soft)" stroke-width="1"/>
        <text x="${x}" y="${height - 3}" fill="var(--faint)" font-size="9" font-family="monospace"
          text-anchor="middle">${m}'</text>`;
    }

    return h`<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"
        role="img" aria-label="Gold difference over time, blue team ahead by 10,530 at the end">
      ${ticks}
      <line x1="0" y1="${mid}" x2="${width}" y2="${mid}" stroke="var(--line)" stroke-width="1"/>
      <path d="${area}" fill="var(--amber)" fill-opacity="0.16"/>
      <polyline points="${points.join(' ')}" fill="none" stroke="var(--amber)" stroke-width="2"
        stroke-linejoin="round"/>
    </svg>`;
  }

  function pillarBar(p) {
    // Each pillar contributes its weighted share of the 0-100 score.
    var ranked = p.rank !== null;
    var contributions = ranked
      ? [{ cls: 'rank', v: p.rank * 0.4 }, { cls: 'perf', v: p.perf * 0.4 }, { cls: 'cons', v: p.cons * 0.2 }]
      : [{ cls: 'perf', v: p.perf * 0.65 }, { cls: 'cons', v: p.cons * 0.35 }];

    var segments = contributions.map(function (c) {
      return h`<div class="pillar-seg ${c.cls}" style="width:${c.v}%"></div>`;
    }).join('');

    var key = ranked
      ? h`<span>RNK ${p.rank.toFixed(0)}</span><span>PRF ${p.perf.toFixed(0)}</span><span>CNS ${p.cons.toFixed(0)}</span>`
      : h`<span>UNRANKED</span><span>PRF ${p.perf.toFixed(0)}</span><span>CNS ${p.cons.toFixed(0)}</span>`;

    return h`<div class="pillars"><div class="pillar-bar">${segments}</div><div class="pillar-key">${key}</div></div>`;
  }

  function byId(id) {
    return PLAYERS.filter(function (p) { return p.id === id; })[0];
  }

  function winRate(w, l) {
    var total = w + l;
    return total ? Math.round((w / total) * 100) : 0;
  }

  // ============================================================
  // Pages
  // ============================================================

  var pages = {};

  pages.standings = function () {
    var rows = PLAYERS.map(function (p, i) {

          ${sparkline(p.form.slice(0, 12), 68, 22)}

        </div>
      </div>`;
    }).join('');

    return h`<div class="page">
      <div class="page-head">
        <div class="eyebrow">Season 7 · resets in 12 days</div>
        <h1>The gap, as of right now</h1>
        <p class="page-sub">Gap Score weights ranked LP, in-game performance against the lobby you

      </div>

      <div class="toolbar">

      <div class="card">
        <div class="card-head">

      <div class="note">

  pages.player = function (id) {

  pages.match = function () {

          <div class="h2h-side right">
            ${avatar(b.name, 'lg')}
            <div>
              <div class="h2h-name">${esc(b.name)}</div>
              <div class="tier" style="color:${tierColor(b.tier)}">${tierLabel(b)}</div>
            </div>
          </div>
        </div>
        <div style="border-top:1px solid var(--line)">${rows}</div>
      </div>

      <div class="grid grid-3 section-gap">
        <div class="card stat"><div class="stat-label">Queued together</div>
          <div class="stat-value">31–18</div>
          <div class="stat-foot">63% — better than either of them alone</div></div>
        <div class="card stat"><div class="stat-label">On opposite teams</div>
          <div class="stat-value">4–2</div>
          <div class="stat-foot">wail leads the direct series</div></div>
        <div class="card stat"><div class="stat-label">Higher score in shared games</div>
          <div class="stat-value">28–21</div>
          <div class="stat-foot">wail outscored sami in 28 of 49</div></div>
      </div>
    </div>`;
  };

  pages.awards = function () {
    var cards = AWARDS.map(function (aw) {
      return h`<div class="card award">
        <div class="award-name">${esc(aw.name)}</div>
        <div class="award-holder">
          ${avatar(aw.who.split(' ')[0])}
          <div>
            <div class="award-who">${esc(aw.who)}</div>
            <div class="award-stat">${esc(aw.stat)}</div>
          </div>
        </div>
        <div class="award-desc">${esc(aw.desc)}</div>
      </div>`;
    }).join('');

    return h`<div class="page">
      <div class="page-head">
        <div class="eyebrow">Week 31 · 14–20 July</div>
        <h1>This week's receipts</h1>
        <p class="page-sub">Computed every Monday from the same match data as the leaderboard,
          then posted to the Discord whether anyone wants it or not.</p>
      </div>
      <div class="grid grid-3">${cards}</div>
      <div class="note">
        <b>The Discord hook.</b> Every award, milestone and sufficiently bad game posts to your
        server automatically. In practice this is the feature that makes people open the site —
        the leaderboard is what they argue about once they're there.
      </div>
    </div>`;
  };

  pages.live = function () {
    var cards = LIVE.map(function (game) {
      var side = function (players, label) {
        var rows = players.map(function (pl) {
          return h`<div class="live-player">
            ${avatar(pl.champ, 'sm')}
            <div class="live-player-id">
              <div class="live-player-name" style="${pl.friend ? 'color:var(--amber);font-weight:600' : ''}">${esc(pl.name)}</div>
              <div class="live-player-champ">${esc(pl.champ)}</div>
            </div>
            <div style="text-align:right">
              <div class="tier" style="color:${tierColor(pl.tier)}">${pl.tier.slice(0, 1) + pl.tier.slice(1).toLowerCase()} ${pl.div}</div>
              ${pl.flag ? h`<div class="chip bad" style="margin-top:3px">${esc(pl.flag)}</div>` : ''}
            </div>
          </div>`;
        }).join('');
        return h`<div class="live-team"><div class="live-team-label">${label}</div>${rows}</div>`;
      };

      return h`<div class="card live-card section-gap">
        <div class="live-head">
          <div class="live-who">
            ${avatar(game.who)}
            <div>
              <div style="font-weight:600">${esc(game.who)} is in game</div>
              <div class="mrow-sub">${game.champ} · ${ROLE_GLYPH[game.role]} · ${game.queue}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="chip accent"><span class="live-dot"></span>${game.elapsed}</span>
            <span class="chip">Spectate</span>
          </div>
        </div>
        <div class="live-teams">
          ${side(game.allies, 'Allies')}
          ${side(game.enemies, 'Enemies')}
        </div>
      </div>`;
    }).join('');

    return h`<div class="page">
      <div class="page-head">
        <div class="eyebrow">Live · refreshed 20 seconds ago</div>
        <h1>Who's playing right now</h1>
        <p class="page-sub">Pulled from the spectator endpoint. Every player in the lobby is
          resolved to their rank, recent form and anything that looks like a smurf account.</p>
      </div>
      ${cards}
      <div class="note">
        <b>Smurf flags</b> come from the mismatch between account level, current rank and champion
        mastery — a level 42 account in Diamond with 900k points on one champion is not a new player.
      </div>
    </div>`;
  };

  pages.champions = function () {
    var rows = CHAMPIONS.map(function (c) {
      var wr = winRate(c.w, c.games - c.w);
      return h`<tr>
        <td><div style="display:flex;align-items:center;gap:10px">${avatar(c.champ, 'sm')}<b>${esc(c.champ)}</b></div></td>
        <td class="num">${c.games}</td>
        <td class="num" style="color:${wr >= 55 ? 'var(--good)' : wr < 45 ? 'var(--bad)' : 'inherit'}">${wr}%</td>
        <td class="num">${c.w}–${c.games - c.w}</td>
        <td class="num">${c.kda.toFixed(2)}</td>
        <td class="num">${c.csm.toFixed(1)}</td>
        <td class="num" style="color:${perfColor(c.perf)}">${c.perf.toFixed(1)}</td>
        <td><a href="#/player/${c.top}" style="color:var(--muted)">${esc(c.top)}</a></td>
      </tr>`;
    }).join('');

    return h`<div class="page">
      <div class="page-head">
        <div class="eyebrow">Champion pool · all members</div>
        <h1>What the group actually plays</h1>
        <p class="page-sub">Aggregated across every tracked account. Sorted by games played —
          the honest measure of what your group is committed to, for better or worse.</p>
      </div>

      <div class="toolbar">
        <div class="seg">
          <button aria-pressed="true">All roles</button>
          <button aria-pressed="false">Top</button>
          <button aria-pressed="false">Jungle</button>
          <button aria-pressed="false">Mid</button>
          <button aria-pressed="false">ADC</button>
          <button aria-pressed="false">Support</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Most played</div>
          <div class="card-note">minimum 5 games</div>
        </div>
        <div class="scroll-x">
          <table>
            <thead><tr>
              <th>Champion</th><th>Games</th><th>Win rate</th><th>Record</th>
              <th>KDA</th><th>CS/min</th><th>Avg score</th><th>Best pilot</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  };

  pages.duos = function () {
    var ids = PLAYERS.map(function (p) { return p.id; });
    var lookup = {};
    DUOS.forEach(function (d) {
      lookup[d[0] + '|' + d[1]] = { w: d[2], l: d[3] };
      lookup[d[1] + '|' + d[0]] = { w: d[2], l: d[3] };
    });

    var header = ids.map(function (id) {
      return h`<th title="${esc(id)}">${esc(id.slice(0, 4))}</th>`;
    }).join('');

    var body = ids.map(function (rowId) {
      var cells = ids.map(function (colId) {
        if (rowId === colId) return '<td><div class="cell empty">—</div></td>';
        var pair = lookup[rowId + '|' + colId];
        if (!pair) return '<td><div class="cell empty" title="No games together">·</div></td>';
        var wr = winRate(pair.w, pair.l);
        // Intensity tracks how far the pair sits from a coin flip.
        var strength = Math.min(1, Math.abs(wr - 50) / 25);
        var hue = wr >= 50 ? 'var(--good)' : 'var(--bad)';
        var bg = wr >= 50
          ? 'rgba(63,207,142,' + (0.08 + strength * 0.3).toFixed(2) + ')'
          : 'rgba(240,87,106,' + (0.08 + strength * 0.3).toFixed(2) + ')';
        return h`<td><div class="cell" style="background:${bg};color:${hue}"
          title="${esc(rowId)} + ${esc(colId)}: ${pair.w}W ${pair.l}L">
          ${wr}%<small>${pair.w}–${pair.l}</small></div></td>`;
      }).join('');
      return h`<tr><th class="rowhead">${esc(rowId)}</th>${cells}</tr>`;
    }).join('');

    return h`<div class="page">
      <div class="page-head">
        <div class="eyebrow">Synergy</div>
        <h1>Who you should actually duo with</h1>
        <p class="page-sub">Win rate for every pair that has queued together. Colour intensity
          tracks distance from a coin flip, so the real signal stands out from the noise.</p>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Pair win rate</div>
          <div class="card-note">minimum 5 games together</div>
        </div>
        <div class="scroll-x" style="padding:14px">
          <table class="matrix">
            <thead><tr><th></th>${header}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-3 section-gap">
        <div class="card stat"><div class="stat-label">Best pair</div>
          <div class="stat-value" style="font-size:17px;color:var(--good)">sami + yousef</div>
          <div class="stat-foot">27–9 · 75% over 36 games</div></div>
        <div class="card stat"><div class="stat-label">Worst pair</div>
          <div class="stat-value" style="font-size:17px;color:var(--bad)">sami + bilal</div>
          <div class="stat-foot">8–14 · 36% over 22 games</div></div>
        <div class="card stat"><div class="stat-label">Most queued</div>
          <div class="stat-value" style="font-size:17px">wail + sami</div>
          <div class="stat-foot">49 games — nobody else is close</div></div>
      </div>
    </div>`;
  };

  // ============================================================
  // Router
  // ============================================================

  var NAV = [
    { href: '#/', glyph: '▤', label: 'Standings', short: 'Rank' },
    { href: '#/live', glyph: '◉', label: 'Live now', short: 'Live' },
    { href: '#/awards', glyph: '★', label: 'Weekly awards', short: 'Awards' },
    { href: '#/h2h', glyph: '⇄', label: 'Head to head', short: 'H2H' },
    { href: '#/champions', glyph: '◈', label: 'Champions', short: 'Champs' },
    { href: '#/duos', glyph: '⊞', label: 'Duo synergy', short: 'Duos' }
  ];

  function routeKey() {
    var hash = location.hash.replace(/^#\/?/, '');
    if (!hash) return { page: 'standings' };
    var parts = hash.split('/');
    if (parts[0] === 'player') return { page: 'player', arg: parts[1] };
    if (parts[0] === 'match') return { page: 'match', arg: parts[1] };
    return { page: pages[parts[0]] ? parts[0] : 'standings' };
  }

  function navHref(key) {
    if (key.page === 'standings') return '#/';
    return '#/' + key.page;
  }

  function renderNav(key) {
    var current = navHref(key);
    document.getElementById('nav').innerHTML =
      '<div class="nav-label">Group</div>' +
      NAV.slice(0, 3).map(function (item) {
        return h`<a class="nav-item" href="${item.href}"${item.href === current ? ' aria-current="page"' : ''}>
          <span class="nav-glyph">${item.glyph}</span>${item.label}</a>`;
      }).join('') +
      '<div class="nav-label">Analysis</div>' +
      NAV.slice(3).map(function (item) {
        return h`<a class="nav-item" href="${item.href}"${item.href === current ? ' aria-current="page"' : ''}>
          <span class="nav-glyph">${item.glyph}</span>${item.label}</a>`;
      }).join('');

    document.getElementById('tabbar').innerHTML = NAV.map(function (item) {
      return h`<a href="${item.href}"${item.href === current ? ' aria-current="page"' : ''}>
        <span class="nav-glyph">${item.glyph}</span>${item.short}</a>`;
    }).join('');
  }

  function render() {
    var key = routeKey();
    renderNav(key);
    document.getElementById('main').innerHTML = pages[key.page](key.arg);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
